name: Update Transcripts

on:
  schedule:
    # 毎月1日の午前9時(JST)に実行
    - cron: '0 0 1 * *'
  workflow_dispatch: # 手動実行も可能

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install yt-dlp
        run: pip install yt-dlp

      - name: Get existing video IDs
        run: |
          grep -oP 'watch\?v=\K[^) |]+' transcripts/*.md | sort -u > existing_ids.txt
          echo "Existing videos: $(wc -l < existing_ids.txt)"

      - name: Fetch current channel video list
        run: |
          yt-dlp --flat-playlist --print "%(id)s" \
            "https://www.youtube.com/@yoshisuntv7502/videos" \
            > all_ids.txt 2>/dev/null
          echo "Total channel videos: $(wc -l < all_ids.txt)"

      - name: Find new videos
        run: |
          comm -23 <(sort all_ids.txt) existing_ids.txt > new_ids.txt
          echo "New videos to process: $(wc -l < new_ids.txt)"
          cat new_ids.txt

      - name: Download subtitles and metadata for new videos
        if: ${{ hashFiles('new_ids.txt') != '' }}
        run: |
          if [ ! -s new_ids.txt ]; then
            echo "No new videos found"
            exit 0
          fi

          mkdir -p subs
          while IFS= read -r vid; do
            echo "Processing: $vid"
            yt-dlp \
              --write-auto-subs --sub-lang "ja-orig,ja" --sub-format srt \
              --write-info-json \
              --skip-download \
              --no-overwrites \
              -o "subs/%(id)s" \
              "https://www.youtube.com/watch?v=${vid}" 2>/dev/null || true
          done < new_ids.txt

      - name: Convert to Markdown
        if: ${{ hashFiles('new_ids.txt') != '' }}
        run: |
          if [ ! -s new_ids.txt ]; then
            echo "No new videos to convert"
            exit 0
          fi

          python3 << 'PYEOF'
          import json, os, re, glob
          from datetime import datetime
          from pathlib import Path

          SUBS_DIR = Path("subs")
          OUT_DIR = Path("transcripts")

          def clean_srt(srt_text):
              blocks = re.split(r"\n\n+", srt_text.strip())
              texts = []
              for block in blocks:
                  text_lines = []
                  for line in block.strip().splitlines():
                      line = line.strip()
                      if not line or re.match(r"^\d+$", line) or re.match(r"\d{2}:\d{2}:\d{2}", line):
                          continue
                      line = re.sub(r"<[^>]+>", "", line).strip()
                      if line:
                          text_lines.append(line)
                  if text_lines:
                      texts.append(" ".join(text_lines))
              if not texts:
                  return ""
              result = [texts[0]]
              for i in range(1, len(texts)):
                  if texts[i] != result[-1]:
                      result.append(texts[i])
              return "\n".join(result)

          def sanitize_filename(title):
              title = re.sub(r'[\\/:*?"<>|]', '', title)
              title = re.sub(r'\s+', ' ', title).strip()
              return title[:100]

          def format_duration(seconds):
              if not seconds: return "不明"
              h, m, s = seconds // 3600, (seconds % 3600) // 60, seconds % 60
              return f"{h}:{m:02d}:{s:02d}" if h > 0 else f"{m}:{s:02d}"

          new_videos = []
          for jf in sorted(SUBS_DIR.glob("*.info.json")):
              vid = jf.stem.replace(".info", "")
              with open(jf, "r", encoding="utf-8") as f:
                  info = json.load(f)

              # Skip playlist metadata
              if info.get("_type") == "playlist":
                  continue

              title = info.get("title", vid)
              upload_date = info.get("upload_date", "")
              description = info.get("description", "")
              duration = info.get("duration", 0)
              view_count = info.get("view_count", 0)
              url = f"https://www.youtube.com/watch?v={vid}"

              date_str, date_fn = "", ""
              if upload_date:
                  try:
                      dt = datetime.strptime(upload_date, "%Y%m%d")
                      date_str = dt.strftime("%Y年%m月%d日")
                      date_fn = dt.strftime("%Y-%m-%d")
                  except ValueError:
                      date_str = upload_date
                      date_fn = upload_date

              sub_text = ""
              for pat in [f"{vid}.ja-orig.srt", f"{vid}.ja.srt"]:
                  sp = SUBS_DIR / pat
                  if sp.exists():
                      with open(sp, "r", encoding="utf-8") as f:
                          sub_text = clean_srt(f.read())
                      break
              if not sub_text:
                  sub_text = "（字幕データなし）"

              safe_title = sanitize_filename(title)
              filename = f"{date_fn}_{safe_title}.md" if date_fn else f"{safe_title}.md"

              md = f"""# {title}

          | 項目 | 内容 |
          |------|------|
          | **動画URL** | {url} |
          | **公開日** | {date_str} |
          | **再生時間** | {format_duration(duration)} |
          | **再生回数** | {view_count:,} |

          ## 概要
          {description}

          ---

          ## 文字起こし

          {sub_text}
          """
              with open(OUT_DIR / filename, "w", encoding="utf-8") as f:
                  f.write(md)
              new_videos.append({"title": title, "date": date_fn, "filename": filename, "duration": format_duration(duration), "url": url})
              print(f"  ✓ {title[:60]}")

          print(f"\nNew videos processed: {len(new_videos)}")
          PYEOF

      - name: Rebuild README
        run: |
          python3 << 'PYEOF'
          import json, os, re
          from pathlib import Path

          OUT_DIR = Path("transcripts")
          videos = []
          for md_file in sorted(OUT_DIR.glob("*.md")):
              name = md_file.stem
              # Extract date and title from filename
              match = re.match(r"(\d{4}-\d{2}-\d{2})_(.*)", name)
              if match:
                  date, title = match.group(1), match.group(2)
              else:
                  date, title = "", name

              # Extract duration from file content
              duration = "不明"
              with open(md_file, "r", encoding="utf-8") as f:
                  for line in f:
                      m = re.search(r"\*\*再生時間\*\* \| (.+)", line)
                      if m:
                          duration = m.group(1).strip()
                          break

              videos.append({"date": date, "title": title, "filename": md_file.name, "duration": duration})

          videos.sort(key=lambda v: v.get("date", ""), reverse=True)

          lines = [
              "# YoshiSunTV 文字起こしアーカイブ",
              "",
              f"[YoshiSunTV](https://www.youtube.com/@yoshisuntv7502) の全動画の自動文字起こしです。",
              "",
              f"**総動画数**: {len(videos)}本",
              "",
              "---",
              "",
              "## 動画一覧",
              "",
              "| 公開日 | タイトル | 再生時間 |",
              "|--------|---------|---------|",
          ]
          for v in videos:
              safe_fn = v['filename'].replace(' ', '%20')
              lines.append(f"| {v.get('date', '不明')} | [{v['title']}](transcripts/{safe_fn}) | {v['duration']} |")

          with open("README.md", "w", encoding="utf-8") as f:
              f.write("\n".join(lines) + "\n")
          print(f"README.md updated with {len(videos)} videos")
          PYEOF

      - name: Cleanup temp files
        run: rm -rf subs/ existing_ids.txt all_ids.txt new_ids.txt

      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No new videos to commit"
          else
            COUNT=$(git diff --cached --name-only -- transcripts/ | wc -l)
            git commit -m "auto: ${COUNT}本の新しい動画の文字起こしを追加"
            git push
          fi
